<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lowe's Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 id="main"> Student Grade Management System </h1>
    <form class="sf">
    <label for="name">Student Name:</label>
    <input type="text" id="name" name="name">
    <label for="math">Mathematics:</label>
    <input type="number" id="math" name="math">

    <label for="physics">Physics:</label>
    <input type="number" id="physics" name="physics">

    <label for="chemistry">Chemistry:</label>
    <input type="number" id="chemistry" name="chemistry">

    <label for="english">English:</label>
    <input type="number" id="english" name="english">

    <label for="history">History:</label>
    <input type="number" id="history" name="history">

    <label for="extra">Extra Curricular:</label>
    <input type="text" id="extra" name="extra">

    <button id="z" type="submit">Add Student</button>
</form>
    <h2>Students Data</h2>
    <table>
        <thead>
            <tr>
        <th>Student Name</th>
        <th>Mathematics</th>
        <th>Physics</th>
        <th>Chemistry</th>
        <th>English</th>
        <th>History</th>
        <th>Extra Curricular</th>
        <th>Total</th>
        <th>Average</th>
        <th>Highest</th>
        <th>Weakest</th>
        <th>Grade</th>
        <th>Action</th>
        </tr>
        </thead>
    <tbody id="display">
    </tbody>
    </table>
    <button type="button" id="exportBtn">Store in Database</button>
    <script src="script.js"></script>
</body>
</html>
